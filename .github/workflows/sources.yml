name: Build IMM sources

on:
  push:
    branches: [main]
    paths: ['tools/build-imm-sources.mjs', '.github/workflows/sources.yml']
  schedule:
    - cron: '17 14 * * 6'   # Sunday 00:17 Brisbane, weekly refresh of new IMM insights
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sources
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock node-html-parser@6.1.13
      - run: node tools/build-imm-sources.mjs
      - name: Commit sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add sources
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh IMM sources"
          git pull --rebase origin main
          git push origin HEAD:main
