name: Render social images

on:
  push:
    branches: [main]
    paths: ['specs/**', 'render/**', 'assets/**', 'photos.json', 'tools/contact.mjs', '.github/workflows/render.yml']
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-render every image (1) or only missing ones (0)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock playwright-core@1.52.0
      - name: Render cards and Stories
        run: node render/render.mjs || echo "RENDER_FAILED=1" >> "$GITHUB_ENV"
        env:
          CI: 'true'
          FORCE: ${{ github.event.inputs.force || '0' }}
      - name: Contact sheet of the photo library
        if: hashFiles('photos.json') != ''
        run: node tools/contact.mjs
        env:
          CI: 'true'
      - name: Commit rendered images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A cards stories review
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Render social images"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if any card broke the layout rules
        if: env.RENDER_FAILED == '1'
        run: |
          cat stories/render-errors.txt || true
          exit 1
