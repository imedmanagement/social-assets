name: Render social images

on:
  push:
    branches: [main]
    paths: ['specs/**', 'render/**', 'assets/**', '.github/workflows/render.yml']
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-render every image (1) or only missing ones (0)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock playwright-core@1.52.0
      - run: node render/render.mjs
        env:
          CI: 'true'
          FORCE: ${{ github.event.inputs.force || '0' }}
      - name: Commit rendered images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add cards stories
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Render social images"
          git pull --rebase origin main
          git push origin HEAD:main
